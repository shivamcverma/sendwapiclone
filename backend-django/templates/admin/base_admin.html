{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Super Admin{% endblock %} | Achyuta Web</title>

    <!-- Google Font – Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* content area — soft lavender-gray, professional */
            --bg: #f6f5fb;
            --card-bg: #ffffff;
            --card-bg-soft: #f7f6fd;
            --border: #eae8f5;
            --text: #1a1533;
            --text-dim: #6b6584;
            --text-faint: #a29cbb;

            /* sidebar — deep indigo-navy gradient */
            --sidebar-bg: #14102b;
            --sidebar-bg-2: #1c1640;
            --sidebar-bg-soft: #201a44;
            --sidebar-border: #2c2456;
            --sidebar-text: #b8b0d9;
            --sidebar-text-dim: #746c98;

            /* primary accent — violet → indigo */
            --accent: #7c3aed;
            --accent-2: #4f46e5;
            --accent-glow: rgba(124, 58, 237, .14);
            --accent-glow-strong: rgba(124, 58, 237, .32);

            /* secondary accent — amber, for highlights/stats */
            --highlight: #f59e0b;
            --highlight-bg: #fff8eb;

            /* tertiary accent — teal, for positive/secondary stats */
            --teal: #0d9488;
            --teal-bg: #ecfdf9;

            --danger: #e11d48;
            --danger-bg: #fef1f4;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --warn: #d97706;
            --warn-bg: #fffbeb;

            --shadow: 0 2px 12px rgba(26, 21, 51, .06);
            --shadow-lg: 0 20px 40px rgba(26, 21, 51, .12);

            --border-radius: 1rem;
            --transition: .2s cubic-bezier(.4, 0, .2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden
        }

        a {
            color: inherit;
            text-decoration: none
        }

        /* -------- Animations (unchanged) -------- */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .page-header {
            animation: fadeInUp .45s ease both;
        }

        .grid-cards .card {
            opacity: 0;
            animation: fadeInUp .45s ease forwards;
        }

        .grid-cards .card:nth-child(1) { animation-delay: .04s; }
        .grid-cards .card:nth-child(2) { animation-delay: .1s; }
        .grid-cards .card:nth-child(3) { animation-delay: .16s; }
        .grid-cards .card:nth-child(4) { animation-delay: .22s; }
        .grid-cards .card:nth-child(5) { animation-delay: .28s; }
        .grid-cards .card:nth-child(6) { animation-delay: .34s; }

        .table {
            animation: fadeInUp .5s ease .1s both;
        }

        .sidebar .nav a {
            animation: slideInLeft .4s ease both;
        }

        .sidebar .nav a:nth-child(1) { animation-delay: .03s; }
        .sidebar .nav a:nth-child(2) { animation-delay: .08s; }
        .sidebar .nav a:nth-child(3) { animation-delay: .13s; }
        .sidebar .nav a:nth-child(4) { animation-delay: .18s; }

        /* -------- Sidebar -------- */
        .sidebar {
            width: 268px;
            background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
            color: var(--sidebar-text);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: var(--transition)
        }

        .sidebar .brand {
            padding: 1.7rem 1.4rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
            border-bottom: 1px solid var(--sidebar-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 8px 18px var(--accent-glow-strong);
        }

        .sidebar .brand strong {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
        }

        .sidebar .brand small {
            display: block;
            margin-top: 2px;
            color: var(--sidebar-text-dim);
            font-size: .68rem;
            font-weight: 500;
            letter-spacing: .4px;
        }

        .sidebar .nav {
            flex: 1;
            padding: 1.1rem .9rem
        }

        .nav-label {
            padding: .3rem .95rem .65rem;
            color: var(--sidebar-text-dim);
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: 1.4px;
        }

        .sidebar .nav a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: .75rem 1rem;
            margin-bottom: 4px;
            border-radius: 10px;
            color: var(--sidebar-text);
            font-weight: 500;
            font-size: .875rem;
            transition: background var(--transition), color var(--transition), transform var(--transition);
        }

        .sidebar .nav a:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
            transform: translateX(3px);
        }

        .sidebar .nav a.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-weight: 700;
            box-shadow: 0 10px 22px var(--accent-glow-strong);
        }

        .sidebar-bottom {
            border-top: 1px solid var(--sidebar-border);
            padding: 1.05rem 1.15rem 1.25rem;
        }

        .user-mini {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 13px;
            background: var(--sidebar-bg-soft);
        }

        .avatar {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .user-mini strong {
            display: block;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
        }

        .user-mini small {
            display: block;
            margin-top: 1px;
            color: var(--sidebar-text-dim);
            font-size: 10px;
        }

        .logout-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px 14px;

            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 10px;

            background: rgba(255, 255, 255, .03);
            color: #fb7185;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            transition: var(--transition);
        }

        .logout-btn:hover {
            background: rgba(225, 29, 72, .14);
            border-color: rgba(225, 29, 72, .3);
            transform: translateY(-1px);
        }

        /* -------- Topbar -------- */
        .topbar {
            height: 64px;
            background: var(--card-bg);
            color: var(--text);
            border-bottom: 1px solid var(--border);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.7rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
            animation: fadeIn .4s ease both;
        }

        .topbar .menu-toggle {
            display: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-dim);
        }

        .topbar .profile {
            display: flex;
            align-items: center;
            gap: .7rem;
            font-size: .87rem;
            font-weight: 600;
            color: var(--text);
        }

        .topbar .profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        /* -------- Main -------- */
        .main {
            flex: 1;
            padding: 1.85rem;
            overflow-y: auto
        }

        .page-header {
            margin-bottom: 1.7rem
        }

        .page-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: .3rem;
            color: var(--text);
            letter-spacing: -.6px;
        }

        .page-header p {
            color: var(--text-dim);
            font-size: .9rem;
            font-weight: 500;
        }

        /* -------- Cards -------- */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1.1rem;
            margin-bottom: 2.1rem
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.4rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #ded8f7;
        }

        .card h3 {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: .6rem
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -.6px;
        }

        /* alternate accent colors for stat cards, in source order */
        .grid-cards .card:nth-child(3n+2) .value {
            color: var(--highlight);
        }

        .grid-cards .card:nth-child(3n+3) .value {
            color: var(--teal);
        }

        /* -------- Tables -------- */
        .table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table th,
        .table td {
            padding: .9rem 1.1rem;
            text-align: left;
            font-size: .87rem
        }

        .table th {
            background: var(--card-bg-soft);
            font-weight: 700;
            color: var(--text-dim);
            font-size: .72rem;
            letter-spacing: .6px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        .table td {
            color: var(--text);
            border-bottom: 1px solid var(--border);
            font-weight: 500;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .table tbody tr {
            transition: background var(--transition);
        }

        .table tbody tr:hover {
            background: var(--card-bg-soft);
        }

        .badge {
            display: inline-block;
            padding: .32rem .7rem;
            border-radius: 30px;
            font-size: .72rem;
            font-weight: 700
        }

        .badge.active {
            background: var(--success-bg);
            color: var(--success);
        }

        .badge.inactive {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .badge.expired {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .badge.pending {
            background: var(--warn-bg);
            color: var(--warn);
        }

        .btn {
            display: inline-block;
            padding: .6rem 1.15rem;
            border-radius: .6rem;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            border: none;
            text-align: center
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            box-shadow: 0 8px 18px var(--accent-glow-strong);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px var(--accent-glow-strong);
        }

        .btn-outline {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--card-bg-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            margin-bottom: 1rem
        }

        .filter-bar input,
        .filter-bar select {
            padding: .58rem .9rem;
            border: 1px solid var(--border);
            border-radius: .6rem;
            background: var(--card-bg);
            color: var(--text);
            font-size: .85rem;
            font-family: inherit;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .filter-bar input::placeholder {
            color: var(--text-faint);
        }

        /* -------- Responsive -------- */
        @media(max-width:991px) {
            .sidebar {
                position: fixed;
                left: -268px;
                top: 0;
                height: 100vh;
                z-index: 100
            }

            .sidebar.open {
                left: 0
            }

            .topbar .menu-toggle {
                display: block
            }

            .main {
                padding: 1rem
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">A</div>
            <div>
                <strong>Achyuta Web</strong>
                <small>WhatsApp Integration</small>
            </div>
        </div>
        <div class="nav">
            <div class="nav-label">MAIN MENU</div>

            <a href="{% url 'superadmin:dashboard' %}"
                class="{% if request.resolver_match.view_name == 'superadmin:dashboard' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{% url 'superadmin:users' %}"
                class="{% if request.resolver_match.view_name == 'superadmin:users' %}active{% endif %}">
                Users
            </a>
            <a href="{% url 'superadmin:subscriptions' %}"
                class="{% if request.resolver_match.view_name == 'superadmin:subscriptions' %}active{% endif %}">
                Subscription Management
            </a>
            <a href="{% url 'superadmin:history' %}"
                class="{% if request.resolver_match.view_name == 'superadmin:history' %}active{% endif %}">
                History
            </a>
        </div>

        <div class="sidebar-bottom">
            <div class="user-mini">
                <div class="avatar" id="avatarInit">JD</div>
                <div>
                    <strong id="sidebarUser">John Doe</strong>
                    <small>{{ subscription_plan|default:"Free plan" }}</small>
                </div>
            </div>
            <button type="button" class="logout-btn" onclick="logoutUser()">
                <span>↪</span>
                Logout
            </button>
        </div>
    </nav>

    <!-- Main + Topbar -->
    <div class="main-wrapper" style="flex:1;display:flex;flex-direction:column;">
        <header class="topbar">
            <div class="menu-toggle" onclick="toggleSidebar()">&#9776;</div>
            <div class="profile">
                <span>Super Admin</span>
                <img src="{% static 'img/avatar.png' %}" alt="avatar">
            </div>
        </header>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open') }
                const accessToken =
            localStorage.getItem("access_token");
        const savedUser =
            localStorage.getItem("user");

        if (savedUser) {

            try {

                const user =
                    JSON.parse(savedUser);

                if (user.email) {

                    document
                        .getElementById("sidebarUser")
                        .innerText =
                        user.email;

                }

            } catch (error) {

                console.log(error);

            }

        }

        async function logoutUser() {

            const refreshToken =
                localStorage.getItem("refresh_token");

            try {

                const response = await fetch(
                    "/api/accounts/logout/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            refresh: refreshToken
                        })
                    }
                );

                const result = await response.json();

                console.log("Logout response:", result);

                /*
                * Logout successful
                */
                if (response.ok) {

                    localStorage.removeItem("user");
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("refresh_token");

                    window.location.href = "/login/";

                    return;
                }


                /*
                * Logout failed
                */
                console.error(
                    "Logout failed:",
                    result
                );

                /*
                * Token already invalid/expired hai,
                * to local session ko phir bhi clear kar do.
                */
                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.removeItem("user");
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("refresh_token");

                    window.location.href = "/login/";

                    return;
                }

                alert(
                    result.detail ||
                    result.message ||
                    "Logout failed"
                );


            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                alert(
                    "Logout server se connect nahi ho pa raha."
                );
            }
        }
    </script>
</body>

</html>
